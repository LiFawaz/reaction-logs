name: Publish Reaction Logs repository

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  packages: read

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"

      - uses: android-actions/setup-android@v4
        with:
          packages: platform-tools

      - name: Install Android SDK packages
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.6.1"

      - name: Build plugin
        run: gradle --no-daemon packageReactionLogs
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Prepare repository
        run: |
          python3 - <<'PY'
          import hashlib, json, shutil
          from pathlib import Path

          manifest = json.loads(Path("plugins/reaction-logs/manifest.json").read_text())
          plugin_id = manifest["id"]
          version = manifest["version"]
          archive = Path(f"build/dist/{plugin_id}@{version}.zip")
          data = archive.read_bytes()
          publish = Path("publish")
          pool = publish / "pool"
          pool.mkdir(parents=True)
          shutil.copy2(archive, pool / archive.name)

          entry = {
              "url": f"https://raw.githubusercontent.com/LiFawaz/reaction-logs/gh-pages/pool/{archive.name}",
              "sha256": hashlib.sha256(data).hexdigest(),
              "size": len(data),
              "dependencies": manifest.get("dependencies", {})
          }
          index = {
              "format": 1,
              "name": "LiFawaz Reaction Logs",
              "description": "Valenced plugin repository for locally logging removed reactions.",
              "plugins": {
                  plugin_id: {
                      "name": manifest["name"],
                      "description": manifest["description"],
                      "author": manifest["author"],
                      "channels": {"latest": version},
                      "versions": {version: entry}
                  }
              }
          }
          (publish / "index.json").write_text(json.dumps(index, indent=2) + "\\n")
          PY

      - name: Publish repository
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: gh-pages
          publish_dir: ./publish
          force_orphan: true
